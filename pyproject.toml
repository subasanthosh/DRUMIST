[project]
name = "drumist"
version = "0.1.0"
description = "Audio-to-pattern drum sequencer and analysis API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "jupyter>=1.1.1",
    "joblib>=1.5.3",
    "librosa>=0.11.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.5",
    "python-multipart>=0.0.20",
    "scikit-learn==1.9.0",
    "ultralytics>=8.4.80",
    "uvicorn[standard]>=0.35.0",
]
